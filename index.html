<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('deloken_theme');
          var isDark =
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#020617');
          }
        } catch (e) {}
      })();
    </script>
    <title>DELOKEN — Hybrid Learning, DIY & Documentary Platform</title>
    <meta
      name="description"
      content="DELOKEN adalah platform pembelajaran hybrid, proyek DIY, keterampilan praktis, dan dokumenter independen dengan kurasi kreator dan akses dwibahasa ID/EN."
    />
    <meta property="og:title" content="DELOKEN — Hybrid Learning, DIY & Documentary Platform" />
    <meta
      property="og:description"
      content="Belajar keterampilan praktis, proyek DIY, dan film dokumenter terkurasi di DELOKEN."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-slate-900 dark:selection:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
